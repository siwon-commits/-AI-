<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 실생활 사진 생성기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
    h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input, button { padding: 12px; font-size: 16px; margin-top: 8px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #007bff; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 12px; }
    button:hover { background: #0056b3; }
    button:disabled { background: #9bbcf0; cursor: wait; }
    button.sub { background: #fff; color: #555; border: 1px solid #ccc; font-weight: normal; font-size: 14px; padding: 8px; }
    #result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background: #f9f9f9; border-radius: 6px; word-break: break-all; }
    .combo { font-weight: bold; color: #0056b3; }
    details { margin-top: 8px; font-size: 13px; color: #666; }
    img { max-width: 100%; height: auto; margin-top: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: block; }
    .err { color: #d00; }
    .info { font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h2>📷 한국 실생활 사진 생성기</h2>
  <p class="info">키워드에 "사람"이 있으면 인물 포함, "손"이 있으면 손만, 둘 다 없으면 사람 없이 생성됩니다.</p>

  <label for="keyword">키워드</label>
  <input type="text" id="keyword" placeholder="예: 싱크대, 에어컨 청소하는 사람, 손으로 필터 교체" />

  <button id="genBtn" onclick="generate()">다른 사진 1장</button>
  <button class="sub" onclick="resetHistory()">조합 기록 초기화</button>

  <div id="result"><p>키워드를 입력하고 버튼을 누르세요.</p></div>

  <script>
    const HISTORY_KEY = "photo_combo_history";
    const MAX_HISTORY = 15;
    let busy = false;

    const SYSTEM_PROMPT = `너는 한국 생활 공간 실물 사진의 장면을 설계한다. 사용자가 키워드와 이전 조합 목록을 주면, 새 장면 1개를 설계한다.

[인물]
- 키워드에 "사람"이 있으면: 자연스러운 한국인 성인. 성별·나이·옷·헤어·자세를 이전 조합과 다르게. 여러 명이면 옷차림도 서로 다르게.
- "사람"이 없으면: 사람과 신체 일부가 전혀 없는 장면.
- "손"이 있으면: 손과 최소한의 팔만. 얼굴·상체 없음.

[촬영 범위]
- 행동(청소하는, 교체하는 등): 행동과 주변 공간이 한눈에 보이게 넓게.
- 사물(장롱, 에어컨, 싱크대 등): 사물이 주인공. 크고 선명하게, 실제 형태·재질 그대로.
- 둘 다 있으면 행동과 사물이 모두 잘 보이게.

[변주]
- 인물(성별·나이·인원·옷) / 공간(주거 형태·방 종류·연식) / 구도(카메라 높이·방향·거리) / 조명(시간대·날씨·광원) / 색감(벽·바닥·가구 톤) 5가지를 이전 조합들과 모두 다르게 정한다.
- 공간은 키워드와 현실적으로 맞는 곳만. (싱크대→주방, 세탁기→다용도실·베란다·욕실)
- 신축 아파트, 구축 아파트, 빌라, 원룸, 오피스텔, 단독주택, 상가주택 등 한국 주거 환경을 폭넓게.
- 밝은 신축 아파트, 흰 벽, 30대 여성, 정면 구도 같은 무난한 기본값 반복 금지.

[출력] 아래 JSON만 출력한다. 설명, 마크다운, 코드블록 금지.
{"combo":"인물: ○○ / 공간: ○○ / 구도: ○○ / 조명: ○○ / 색감: ○○","scene":"한국어 2~3문장 장면 묘사(방 구조, 가구, 바닥, 창 위치, 카메라 높이, 인물 옷·자세)","prompt":"영어 이미지 프롬프트"}
- 사람 없는 키워드는 combo에서 인물 항목 생략. 손 키워드는 "인물: 손만 나옴".

[prompt 작성 규칙]
- 반드시 영어로만. 키워드 대상(영어)을 맨 앞에 쓴다.
- scene 내용만 근거로, 보이는 것만 긍정형으로 묘사한다. "no", "without", "not" 같은 부정어 금지.
- 사람 없는 장면은 사람을 아예 언급하지 않는다. 손 장면은 "close-up of a pair of hands ..., cropped at the forearms" 형태로.
- 주거 형태, 방 종류, 벽·바닥 색, 카메라 높이·방향·거리, 광원을 포함한다.
- 마지막은 "casual smartphone photo, realistic, natural colors, lived-in Korean home, plain unbranded surfaces"로 끝낸다.
- 60~90단어.`;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function loadAll() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "{}"); } catch { return {}; }
    }
    function loadHistory(keyword) { return loadAll()[keyword] || []; }
    function saveHistory(keyword, combo) {
      const all = loadAll();
      all[keyword] = [...(all[keyword] || []), combo].slice(-MAX_HISTORY);
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(all)); } catch {}
    }
    function resetHistory() {
      try { localStorage.removeItem(HISTORY_KEY); } catch {}
      document.getElementById("result").innerHTML = "<p>조합 기록을 초기화했어요.</p>";
    }

    async function designScene(keyword, history) {
      const userMsg =
        `키워드: ${keyword}\n` +
        `"사람" 포함: ${keyword.includes("사람") ? "예" : "아니오"}\n` +
        `"손" 포함: ${keyword.includes("손") ? "예" : "아니오"}\n` +
        `이전 조합(이것들과 5가지 요소 모두 겹치지 않게):\n` +
        (history.length ? history.map((h, i) => `${i + 1}. ${h}`).join("\n") : "(없음)");

      const res = await fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: userMsg }
          ],
          seed: Math.floor(Math.random() * 1000000)
        })
      });
      if (!res.ok) throw new Error(`장면 설계 API 오류 (${res.status})`);

      const data = await res.json();
      const text = data?.choices?.[0]?.message?.content || "";
      const clean = text.replace(/```json|```/g, "").trim();
      const match = clean.match(/\{[\s\S]*\}/);
      const obj = JSON.parse(match ? match[0] : clean);

      if (!obj.prompt || !obj.combo) throw new Error("응답 형식 오류");
      if (/[가-힣]/.test(obj.prompt)) throw new Error("영어 프롬프트에 한글이 섞임");
      return obj;
    }

    async function generate() {
      if (busy) return;
      const keyword = document.getElementById("keyword").value.trim();
      const resultDiv = document.getElementById("result");
      const btn = document.getElementById("genBtn");
      if (!keyword) { alert("키워드를 입력해주세요."); return; }

      busy = true; btn.disabled = true;
      resultDiv.innerHTML = "<p>🧠 장면 설계 중...</p>";

      let scene = null, lastErr = null;
      for (let i = 0; i < 2 && !scene; i++) {
        try { scene = await designScene(keyword, loadHistory(keyword)); }
        catch (e) { lastErr = e; }
      }
      if (!scene) {
        resultDiv.innerHTML = `<p class="err">⚠️ 장면 설계 실패: ${esc(lastErr?.message || "알 수 없음")}<br>잠시 후 다시 눌러주세요.</p>`;
        busy = false; btn.disabled = false;
        return;
      }

      saveHistory(keyword, scene.combo);

      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.prompt)}?width=1024&height=1024&seed=${seed}&nologo=true&enhance=false&model=flux`;

      resultDiv.innerHTML = `
        <p class="combo">${esc(scene.combo)}</p>
        <p>${esc(scene.scene || "")}</p>
        <details><summary>영어 프롬프트 보기</summary>${esc(scene.prompt)}</details>
        <p id="loadingText">🎨 이미지 생성 중... (10~30초)</p>
        <img id="generatedImg" style="display:none;" alt="생성된 이미지" />
      `;

      const img = document.getElementById("generatedImg");
      const loading = document.getElementById("loadingText");
      img.onload = () => { loading.style.display = "none"; img.style.display = "block"; busy = false; btn.disabled = false; };
      img.onerror = () => { loading.innerHTML = "<span class='err'>⚠️ 이미지 서버 응답 지연. 다시 눌러주세요.</span>"; busy = false; btn.disabled = false; };
      img.src = imageUrl;
    }

    document.getElementById("keyword").addEventListener("keydown", e => {
      if (e.key === "Enter") generate();
    });
  </script>
</body>
</html>
