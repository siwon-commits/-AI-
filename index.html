  <script>
    const peopleOptions = [
      "a Korean woman in her 50s with short permed hair wearing a floral apron",
      "a Korean man in his 20s wearing a grey hoodie and track pants",
      "a Korean man in his 60s wearing a knit vest",
      "a Korean woman in her 20s with a ponytail wearing an oversized sweatshirt",
      "a Korean man in his 40s wearing a navy polo shirt",
      "a Korean woman in her 40s wearing a striped long-sleeve shirt"
    ];

    // 방 종류는 빼고 주거 형태만 → 방은 키워드에 맞게 모델이 결정
    const housingOptions = [
      "in an old 1990s Korean apartment",
      "in a newly built Korean apartment",
      "in a small Korean villa",
      "in a Korean one-room studio",
      "in a Korean officetel",
      "in an old Korean detached house"
    ];

    const toneOptions = [
      "beige wallpaper and light wood flooring",
      "white tiles and grey surfaces",
      "dark brown wood flooring and ivory walls",
      "light grey walls and oak-tone furniture",
      "slightly worn yellowish wallpaper and linoleum floor"
    ];

    const lightingOptions = [
      "soft morning sunlight from a window",
      "warm ceiling light in the evening",
      "bright overcast daylight",
      "fluorescent indoor lighting at night",
      "afternoon sunlight with soft shadows"
    ];

    // 키워드 유형별 구도
    const objectCamera = [
      "close-up shot, the object fills most of the frame",
      "medium close-up from slightly above",
      "eye-level shot, the object centered and large in frame",
      "angled three-quarter view of the object, sharp focus"
    ];
    const actionCamera = [
      "medium-wide shot showing the person and the surrounding space",
      "shot from a slightly high angle, full action visible",
      "side view at eye level, person and object both clearly visible"
    ];
    const handCamera = [
      "close-up of hands performing the action, only hands and forearms in frame",
      "top-down view of hands working, only hands visible"
    ];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    async function translateToEnglish(text) {
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0].map(seg => seg[0]).join('').trim();
      } catch (e) {
        return null;
      }
    }

    async function generateImage() {
      const keyword = document.getElementById('keyword').value.trim();
      const resultDiv = document.getElementById('result');
      if (!keyword) { alert('키워드를 입력해주세요.'); return; }

      resultDiv.innerHTML = "<p>⏳ 번역 중...</p>";

      const translated = await translateToEnglish(keyword);
      if (!translated || /[가-힣]/.test(translated)) {
        resultDiv.innerHTML = `<p style="color:red;">⚠️ 번역 실패: "${translated ?? '응답 없음'}". 키워드를 영어로 직접 입력해보세요.</p>`;
        return;
      }

      const hasPerson = keyword.includes("사람");
      const hasHand = keyword.includes("손");

      let subjectLine, camera;
      if (hasPerson) {
        subjectLine = `${pick(peopleOptions)}, ${translated}`;
        camera = pick(actionCamera);
      } else if (hasHand) {
        subjectLine = `${translated}, only hands visible`;
        camera = pick(handCamera);
      } else {
        subjectLine = `${translated}, a still life photo of the ${translated} as the main subject, empty room without anyone`;
        camera = pick(objectCamera);
      }

      const prompt = [
        subjectLine,
        pick(housingOptions),
        pick(toneOptions),
        camera,
        pick(lightingOptions),
        "candid amateur smartphone photo, realistic, natural colors, everyday Korean home",
        `the ${translated} is clearly visible and in sharp focus`
      ].join(", ");

      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&seed=${seed}&nologo=true&enhance=false&model=flux`;

      resultDiv.innerHTML = `
        <p><strong>번역:</strong> ${keyword} → ${translated}</p>
        <p><strong>프롬프트:</strong><br>${prompt}</p>
        <p id="loadingText">🎨 생성 중... (5~20초)</p>
        <img src="${imageUrl}" id="generatedImg" style="display:none;" />
      `;

      const img = document.getElementById("generatedImg");
      const loading = document.getElementById("loadingText");
      img.onload = () => { loading.style.display = "none"; img.style.display = "block"; };
      img.onerror = () => { loading.innerHTML = "<span style='color:red;'>⚠️ 서버 응답 지연. 다시 눌러주세요.</span>"; };
    }
  </script>
